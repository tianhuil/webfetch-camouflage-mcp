[project]
name = "webfetch-camouflage-mcp"
version = "0.1.0"
description = "MCP server for web fetching with browser camouflage using curl_cffi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.8.0",
    "fastmcp>=3.1.0",
    "html2text>=2024.2.26",
]

[project.scripts]
webfetch-camouflage-mcp = "webfetch_camouflage_mcp.server:main"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "pyright"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["S101"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
constraint-dependencies = [
    "cryptography>=46.0.5",
    "filelock>=3.20.3",
    "jaraco-context>=6.1.0",
    "pip>=26.0",
    "python-multipart>=0.0.22",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "poethepoet>=0.38.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
